  </g>
  <g fill="#9DAE8E"><rect x="140" y="300" width="260" height="70" rx="6"/><rect x="480" y="300" width="260" height="70" rx="6"/><rect x="820" y="300" width="260" height="70" rx="6"/><rect x="1160" y="300" width="260" height="70" rx="6"/></g>
  <g fill="#F7F0E1" font-family="sans-serif" font-size="20" text-anchor="middle">
